services:
  isaac:
    build:
      context: ..
      dockerfile: docker/isaacsim/Dockerfile
    image: ${ISAAC_IMAGE:-netlab-isaac-sim-jazzy:5.1.0}
    container_name: isaac-sim
    runtime: nvidia
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    shm_size: "16gb"
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      ROS_DISTRO: "jazzy"
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/shared/fastdds.xml
      isaac_sim_package_path: /isaac-sim
      ISAACSIM_HOST: ${ISAACSIM_HOST:-127.0.0.1}
      ISAACSIM_SIGNAL_PORT: ${ISAACSIM_SIGNAL_PORT:-49100}
      ISAACSIM_STREAM_PORT: ${ISAACSIM_STREAM_PORT:-47998}
    volumes:
      - ../workspace/isaac:/workspace/isaac
      - ../workspace/ros2:/workspace/ros2_ws
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
      - ../data/isaac/cache/main:/isaac-sim/.cache:rw
      - ../data/isaac/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ../data/isaac/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ../data/isaac/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ../data/isaac/local-data:/isaac-sim/.local/share/ov/data:rw
      - ../data/isaac/pkg:/isaac-sim/.local/share/ov/pkg:rw
    command:
      - /isaac-sim/runheadless.sh
      - -v
      - --/isaac/startup/ros_bridge_extension=isaacsim.ros2.bridge
      - --/app/livestream/publicEndpointAddress=${ISAACSIM_HOST:-127.0.0.1}
      - --/app/livestream/port=${ISAACSIM_SIGNAL_PORT:-49100}
      - --/persistent/app/window/width=1280
      - --/persistent/app/window/height=720
      - --/app/window/dpiScaleOverride=1.0
      - --/app/window/scaleToMonitor=false
  ros2-core:
    build:
      context: ..
      dockerfile: docker/ros2/Dockerfile
    image: ${ROS2_IMAGE:-netlab-ros2-jazzy:brev}
    container_name: netlab-ros2-core
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DISTRO: "jazzy"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/shared/fastdds.xml
    volumes:
      - ../workspace/ros2:/workspace/ros2
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /workspace/ros2
    command: bash

  sionna-engine:
    build:
      context: ..
      dockerfile: docker/sionna/Dockerfile
    image: ${SIONNA_IMAGE:-netlab-sionna:brev}
    container_name: netlab-sionna-engine
    runtime: nvidia
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
    volumes:
      - ../workspace/sionna:/workspace/sionna
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /workspace/sionna
    command: bash

  px4:
    profiles: ["px4"]
    build:
      context: ..
      dockerfile: docker/PX4/Dockerfile
    image: ${PX4_IMAGE:-netlab-px4-sitl:brev}
    container_name: px4-sitl
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      PX4_HOME_LAT: "22.3080"
      PX4_HOME_LON: "39.1044"
      PX4_HOME_ALT: "10"
    volumes:
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /opt/PX4-Autopilot
    command: bash
