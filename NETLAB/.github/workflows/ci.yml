name: NETLAB release verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Restore executable permissions
        run: |
          chmod +x scripts/netlab scripts/*.sh scripts/diagnostics/*.sh scripts/migration/*.sh scripts/release/*.sh
          chmod +x Docker/scripts/*.sh Docker/docker/isaacsim/entrypoint.sh Docker/workspace/ros2/*.sh
      - name: Host-side release validation
        run: ./scripts/diagnostics/validate_release.sh
      - name: Core microbenchmark
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python3 tests/performance/benchmark_core.py
      - name: Package dry run
        run: ./scripts/release/package_release.sh /tmp/netlab-release
      - name: Verify release archive
        run: unzip -t /tmp/netlab-release/NETLAB_V8_COMPLETE_SYNCHRONIZED_RESEARCH_PLATFORM.zip
