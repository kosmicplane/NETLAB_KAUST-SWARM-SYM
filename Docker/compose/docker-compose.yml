services:
  ros2-core:
    build:
      context: ..
      dockerfile: docker/ros2/Dockerfile
    container_name: netlab-ros2-core
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ${ROS2_HOST_WS:-../workspace/ros2}:/workspace
    stdin_open: true
    tty: true

  sionna-engine:
    build:
      context: ..
      dockerfile: docker/sionna/Dockerfile
    container_name: netlab-sionna-engine
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${SIONNA_HOST_WS:-../workspace/sionna}:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true

  isaacsim:
    build:
      context: ..
      dockerfile: docker/isaacsim/Dockerfile
    container_name: netlab-isaacsim
    network_mode: host
    entrypoint: ["/bin/bash", "-lc", "sleep infinity"]
    environment:
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: ${XAUTHORITY:-/tmp/.docker.xauth}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      OMNI_KIT_ALLOW_ROOT: "1"
    volumes:
      - ${ISAAC_SIM_HOST_DATA:-../data/isaac}:/isaac-sim/userdata
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:${XAUTHORITY:-/tmp/.docker.xauth}:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
  px4:
    build:
      context: ..
      dockerfile: docker/PX4/Dockerfile
    container_name: px4-sitl
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /opt/PX4-Autopilot

  pegasus:
    build:
      context: ..
      dockerfile: docker/pegasus/Dockerfile
    container_name: netlab-pegasus
    network_mode: host
    environment:
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: ${XAUTHORITY:-/tmp/.docker.xauth}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    volumes:
      - ${PEGASUS_HOST_DATA:-../data/pegasus}:/opt/PegasusSimulator/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.docker.xauth}:${XAUTHORITY:-/tmp/.docker.xauth}:rw
    depends_on:
      - ros2-core
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true