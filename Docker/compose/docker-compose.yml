version: "3.9"

services:
  ros2-core:
    build:
      context: ..
      dockerfile: docker/ros2/Dockerfile
    container_name: netlab-ros2-core
    network_mode: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ${ROS2_HOST_WS:-../workspace/ros2}:/workspace
    stdin_open: true
    tty: true

  sionna-engine:
    build:
      context: ..
      dockerfile: docker/sionna/Dockerfile
    container_name: netlab-sionna-engine
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${SIONNA_HOST_WS:-../workspace/sionna}:/workspace
    stdin_open: true
    tty: true
  isaac:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    container_name: isaac-sim
    runtime: nvidia
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - OMNI_KIT_ALLOW_ROOT=1
    command: 
      ./isaac-sim.sh
      --headless
      --streaming webrtc
    ports:
      - "8211:8211"
    volumes:
      - ./isaac-data:/isaac-sim/userdata
    shm_size: "8gb"

  web-viewer:
    image: nvcr.io/nvidia/omniverse-webrtc-web-viewer:latest
    container_name: isaac-web-viewer
    environment:
      - STREAM_SERVER=isaac
      - STREAM_PORT=8211
    ports:
      - "8080:80"
    depends_on:
      - isaac

  px4:
    build:
      context: ..
      dockerfile: docker/PX4/Dockerfile
    container_name: px4-sitl
    network_mode: host
    working_dir: /opt/PX4-Autopilot
    stdin_open: true
    tty: true

  pegasus:
    build:
      context: ..
      dockerfile: docker/pegasus/Dockerfile
    container_name: netlab-pegasus
    network_mode: host
    environment:
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    volumes:
      - ${PEGASUS_HOST_DATA:-../data/pegasus}:/opt/PegasusSimulator/data
    depends_on:
      - ros2-core
    stdin_open: true
    tty: true