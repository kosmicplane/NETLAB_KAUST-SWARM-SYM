services:
  isaac:
    build:
      context: ..
      dockerfile: docker/isaacsim/Dockerfile
    image: kaust-isaac-sim:5.1.0
    container_name: isaac-sim
    runtime: nvidia
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    shm_size: "16gb"

    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      ROS_DISTRO: "jazzy"
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"

    volumes:
      - ../workspace/isaac:/workspace/isaac
      - ../workspace/ros2:/workspace/ros2_ws
      - ../data/isaac:/workspace/data

    command: /isaac-sim/runheadless.sh -v
  ros2-core:
    build:
      context: ..
      dockerfile: docker/ros2/Dockerfile
    image: ${ROS2_IMAGE:-netlab-ros2-humble:brev}
    container_name: netlab-ros2-core
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ../workspace/ros2:/workspace/ros2
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /workspace/ros2
    command: bash

  px4:
    build:
      context: ..
      dockerfile: docker/PX4/Dockerfile
    image: ${PX4_IMAGE:-netlab-px4-sitl:brev}
    container_name: px4-sitl
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      PX4_HOME_LAT: "22.3080"
      PX4_HOME_LON: "39.1044"
      PX4_HOME_ALT: "10"
    volumes:
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /opt/PX4-Autopilot
    command: bash

  sionna-engine:
    build:
      context: ..
      dockerfile: docker/sionna/Dockerfile
    image: ${SIONNA_IMAGE:-netlab-sionna:brev}
    container_name: netlab-sionna-engine
    runtime: nvidia
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
    volumes:
      - ../workspace/sionna:/workspace/sionna
      - ../workspace/shared:/workspace/shared
      - ../workspace/results:/workspace/results
    working_dir: /workspace/sionna
    command: bash
