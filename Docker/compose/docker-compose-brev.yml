version: "3.9"

services:
  ros2-core:
    image: ghcr.io/kosmicplane/netlab-ros2-core:latest
    container_name: netlab-ros2-core
    environment:
      ROS_DOMAIN_ID: 42
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - /opt/netlab/workspace/ros2:/workspace
    stdin_open: true
    tty: true

  sionna-engine:
    image: ghcr.io/kosmicplane/netlab-sionna-engine:latest
    container_name: netlab-sionna-engine
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/netlab/workspace/sionna:/workspace
    stdin_open: true
    tty: true

  isaacsim:
    image: ghcr.io/kosmicplane/netlab-isaacsim-headless:latest
    container_name: netlab-isaacsim
    environment:
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: 42
      ISAACSIM_HEADLESS: "true"
    volumes:
      - /opt/netlab/data/isaac:/isaac-sim/userdata
    stdin_open: true
    tty: true

  pegasus:
    image: ghcr.io/kosmicplane/netlab-pegasus-headless:latest
    container_name: netlab-pegasus
    environment:
      ACCEPT_EULA: Y
      PRIVACY_CONSENT: Y
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: 42
    volumes:
      - /opt/netlab/data/pegasus:/opt/PegasusSimulator/data
    depends_on:
      - ros2-core
    stdin_open: true
    tty: true
